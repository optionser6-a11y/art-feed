# Netlify settings for Nahim (https://nahim.netlify.app)
# The site is plain files: nothing to build, publish the repository as it is.
[build]
  publish = "."

# Small functions that count visits for the owner's dashboard.
[functions]
  directory = "netlify/functions"

# Always fetch the newest app and service worker, so updates reach phones straight away.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/dashboard.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
